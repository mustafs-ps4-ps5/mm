    <!-- ============================================================
    SCRIPTS
    ============================================================ -->
    <script src="int64.js"></script>
    <script src="rop.js"></script>
    <script src="main.js"></script>
    <script src="umtx2.js"></script>
    <script src="custom_host_stuff.js"></script>
    <script src="syscalls.js"></script>
    <script type="module" src="psfree/psfree.js"></script>
    <script src="payload_map.js"></script>

    <script>
        // ============================================================
        // INIT
        // ============================================================
        document.getElementById("current-fw").innerHTML = fw_str;
        registerAppCacheEventHandlers();
        registerL2ButtonHandler();

        document.getElementById("run-jb").addEventListener("click", function() {
            run(false);
        });
        document.getElementById("run-wk-only").addEventListener("click", function() {
            run(true);
        });

        window.onload = function() {
            let autoload = sessionStorage.getItem(SESSIONSTORE_ON_LOAD_AUTORUN_KEY);
            if (autoload) {
                run(autoload == "wkonly", false);
            }
        };

        // ============================================================
        // CACHE MANAGER - إدارة الكاش بالكامل
        // ============================================================
        (function() {
            console.log('Cache Manager v8.0 - Full Cache');
            
            // التحقق من وجود AppCache
            if (window.applicationCache) {
                try {
                    var status = window.applicationCache.status;
                    console.log('AppCache status:', status);
                    // 0 = UNCACHED, 1 = IDLE, 2 = CHECKING, 3 = DOWNLOADING, 4 = UPDATEREADY, 5 = OBSOLETE
                    
                    if (status === window.applicationCache.UPDATEREADY) {
                        window.applicationCache.swapCache();
                        console.log('✅ Cache swapped successfully');
                    }
                } catch (e) {
                    console.log('AppCache error:', e.message);
                }
            } else {
                console.warn('⚠️ AppCache not supported');
            }
            
            // تنظيف التخزين المؤقت عند تغيير الإصدار
            if (sessionStorage.getItem('cache_version') !== 'v8.0') {
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                    sessionStorage.setItem('cache_version', 'v8.0');
                    console.log('✅ Storage cleared - new cache version');
                } catch (e) {
                    console.log('Storage clear error:', e.message);
                }
            }
            
            console.log('✅ Cache Manager ready');
            
            // عرض حالة الكاش في الكونسول
            if (window.applicationCache) {
                var statusText = ['UNCACHED', 'IDLE', 'CHECKING', 'DOWNLOADING', 'UPDATEREADY', 'OBSOLETE'];
                console.log('📦 Cache status:', statusText[window.applicationCache.status] || 'UNKNOWN');
            }
        })();
    </script>

</body>

</html>
